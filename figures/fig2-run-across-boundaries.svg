<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lab  { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .sub  { font-size: 11px; fill: #555; }
    .blk  { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .sz   { font-size: 10px; fill: #444; }
    .note { font-size: 11px; fill: #b3261e; }
    .blue { font-size: 11px; fill: #1565c0; }
    .cell { stroke: #333; stroke-width: 1.5; }
    .hdr  { stroke: #333; stroke-width: 1.5; fill: #9e9e9e; }
  </style>

  <!-- ========== BEFORE ========== -->
  <text class="lab" x="16" y="56">Before</text>
  <text class="sub" x="16" y="72">headers shaded grey</text>

  <rect class="hdr"  x="190" y="40" width="18" height="44"/>
  <rect class="cell" x="208" y="40" width="72" height="44" fill="#c8e6c9"/>
  <text class="blk" x="244" y="60" text-anchor="middle">A</text>
  <text class="sz"  x="244" y="75" text-anchor="middle">whole 4</text>

  <rect class="hdr"  x="280" y="40" width="18" height="44"/>
  <rect class="cell" x="298" y="40" width="112" height="44" fill="#d1c4e9"/>
  <text class="blk" x="354" y="60" text-anchor="middle">B</text>
  <text class="sz"  x="354" y="75" text-anchor="middle">whole 6</text>

  <rect class="hdr"  x="410" y="40" width="18" height="44"/>
  <rect class="cell" x="428" y="40" width="92" height="44" fill="#fff3b0"/>
  <text class="blk" x="474" y="60" text-anchor="middle">C</text>
  <text class="sz"  x="474" y="75" text-anchor="middle">whole 5</text>

  <rect class="hdr"  x="520" y="40" width="18" height="44"/>
  <rect class="cell" x="538" y="40" width="92" height="44" fill="#ffcdd2"/>
  <text class="blk" x="584" y="60" text-anchor="middle">D</text>
  <text class="sz"  x="584" y="75" text-anchor="middle">whole 5, white</text>

  <path d="M 190 104 L 650 104" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a1)"/>
  <circle cx="199" cy="104" r="3.5" fill="#333"/>
  <circle cx="289" cy="104" r="3.5" fill="#333"/>
  <circle cx="419" cy="104" r="3.5" fill="#333"/>
  <circle cx="529" cy="104" r="3.5" fill="#333"/>
  <text class="sub" x="190" y="124">the walk stops only at headers, and reaches D</text>

  <!-- ========== AFTER ========== -->
  <text class="lab" x="16" y="216">After the flush</text>

  <rect class="hdr"  x="190" y="200" width="18" height="44"/>
  <rect class="cell" x="208" y="200" width="72" height="44" fill="#c8e6c9"/>
  <text class="blk" x="244" y="220" text-anchor="middle">A</text>
  <text class="sz"  x="244" y="235" text-anchor="middle">whole 4</text>

  <!-- B's header survives; part of B's body survives; then the written region -->
  <rect class="hdr"  x="280" y="200" width="18" height="44"/>
  <rect class="cell" x="298" y="200" width="42" height="44" fill="#d1c4e9"/>
  <text class="sz"  x="319" y="226" text-anchor="middle">B</text>

  <rect class="cell" x="340" y="200" width="150" height="44" fill="#64b5f6"/>
  <text class="blk" x="415" y="220" text-anchor="middle" fill="#0d2d4d">written by the flush</text>
  <text class="sz"  x="415" y="235" text-anchor="middle" fill="#0d2d4d">from the floor, run_words words</text>

  <!-- remnant of C, then D untouched -->
  <rect class="cell" x="490" y="200" width="30" height="44" fill="#fff3b0" opacity="0.3"/>
  <rect class="hdr"  x="520" y="200" width="18" height="44"/>
  <rect class="cell" x="538" y="200" width="92" height="44" fill="#ffcdd2"/>
  <text class="blk" x="584" y="220" text-anchor="middle">D</text>
  <text class="sz"  x="584" y="235" text-anchor="middle">untouched</text>

  <!-- walk after -->
  <path d="M 190 268 L 412 268" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4"/>
  <circle cx="199" cy="268" r="3.5" fill="#333"/>
  <circle cx="289" cy="268" r="3.5" fill="#333"/>
  <text x="414" y="273" class="note" font-size="15" font-weight="700">&#10007;</text>

  <!-- floor marker, left of the walk break -->
  <path d="M 340 300 L 340 248" stroke="#1565c0" stroke-width="1.6" marker-end="url(#a2)"/>
  <text class="blue" x="190" y="318">the run's floor: inside B, not a header</text>

  <!-- C's header marker -->
  <path d="M 420 338 L 420 248" stroke="#b3261e" stroke-width="1.6" marker-end="url(#a3)"/>
  <text class="note" x="190" y="342">C's header, overwritten. The walk jumps here from B and reads data.</text>

  <text class="note" x="190" y="370" font-weight="600">D is never reached.</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/></marker>
  </defs>
</svg>
