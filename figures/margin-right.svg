<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 640"><text x="24" y="60" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E735C" xml:space="preserve">let rec map f = function</text><text x="24" y="82" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E735C" xml:space="preserve">  | [] -&gt; []</text><text x="24" y="104" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E735C" xml:space="preserve">  | x :: xs -&gt; f x :: map f xs</text><text x="150" y="165" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" text-anchor="middle" fill="#5E6E3F" opacity="1">fix f = f (fix f)</text><text x="150" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" text-anchor="middle" fill="#5E6E3F" opacity="1">Y = λf. (λx. f (x x)) (λx. f (x x))</text><text x="85.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" text-anchor="middle" fill="#5E6E3F" opacity="1">P(0)</text><text x="205.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" text-anchor="middle" fill="#5E6E3F" opacity="1">∀n. P(n) ⇒ P(n+1)</text><line x1="25.0" y1="272" x2="265.0" y2="272" stroke="#5E6E3F" stroke-width="1"/><text x="271.0" y="277" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="start" fill="#5E6E3F" opacity="1">Ind</text><text x="145" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" text-anchor="middle" fill="#5E6E3F" opacity="1">∀n. P(n)</text><text x="145" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" text-anchor="middle" fill="#5E6E3F" opacity="1">{P} c {Q}</text><line x1="80.0" y1="382" x2="210.0" y2="382" stroke="#5E6E3F" stroke-width="1"/><text x="216.0" y="387" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="start" fill="#5E6E3F" opacity="1">Frame</text><text x="145" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" text-anchor="middle" fill="#5E6E3F" opacity="1">{P ∗ R} c {Q ∗ R}</text><text x="145" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5E6E3F" opacity="0.8">mod(c) ∩ fv(R) = ∅</text></svg>